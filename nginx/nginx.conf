server {
    listen 80;
    server_name localhost;

    # Cabeceras de seguridad SOLO para el contenido estatico servido por nginx (location /
    # abajo) -- el backend ya las agrega para sus propias respuestas via Spring Security.
    # Antes vivian aqui, a nivel server{}, por lo que nginx tambien las inyectaba en las
    # respuestas proxied de /api/v1/ y /actuator/ -- add_header no reemplaza cabeceras ya
    # presentes en la respuesta del backend, las ANADE, asi que el cliente recibia dos
    # Content-Security-Policy distintas (verificado real con curl: hallazgo de la auditoria
    # de reproducibilidad 2026-08-29). Por el spec de CSP, el navegador aplica la
    # interseccion de ambas politicas, asi que la CSP mas laxa del backend (que permite
    # localhost:4200/websockets) quedaba silenciosamente recortada por la mas estricta de
    # nginx. Se movieron a location / (unica que las necesita) para que cada capa sea dueña
    # de sus propias cabeceras sin duplicar middleware.
    server_tokens off;

    # Servir archivos estáticos del Frontend Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Soporte para Angular SPA routing

        # Nota: un location con su propio add_header deja de heredar los del
        # server{} (comportamiento estandar de nginx), por eso se repiten aqui.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        # script-src sin 'unsafe-inline'/'unsafe-eval' (auditoria 2026-09-05): el index.html
        # del build de produccion solo referencia bundles externos con hash -- cero scripts
        # inline y AOT en vez de JIT, asi que Angular no necesita ninguno de los dos. Con
        # ellos, la cabecera perdia buena parte de su proteccion contra XSS (alerta 10055
        # de ZAP). connect-src queda en 'self' porque el frontend llama al backend con rutas
        # relativas (/api/...) proxeadas por este mismo nginx: mismo origen siempre.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Hallazgo real (auditoria 2026-08-31): el backend agrega Strict-Transport-Security via
        # Spring Security (SecurityConfig.java) solo para sus propias respuestas (/api/v1/,
        # /actuator/) -- pero el frontend estatico servido aqui mismo (location /, lo primero
        # que carga el navegador) nunca la tenia. Verificado con curl -I http://localhost/: la
        # cabecera estaba ausente. Mismo max-age que el backend (1 anio) para consistencia.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # index.html no debe cachearse agresivamente: referencia nombres de
        # bundle con hash que cambian en cada deploy.
        add_header Cache-Control "no-cache";
    }

    # Hallazgo real (Lighthouse, auditoria 2026-09-06): "no-cache" en location / de arriba
    # tambien aplicaba a los bundles JS/CSS con hash en el nombre (chunk-XXXXXXXX.js,
    # main-XXXXXXXX.js, styles-XXXXXXXX.css) -- el comentario anterior decia que "ya se
    # cacheaban via ETag", pero no-cache fuerza una revalidacion de red en cada carga
    # (round-trip aunque termine en 304), no un cacheo real sin red. Como el nombre de
    # archivo cambia con el contenido (hash de Angular), es seguro marcarlos inmutables:
    # un cache-insight de Lighthouse estimo 572 KiB de ahorro con esto.
    location ~* \.(?:js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Este location define su propio add_header, asi que (regla estandar de nginx,
        # ver comentario en location / arriba) NO hereda el Strict-Transport-Security de
        # ahi -- hallazgo real de la auditoria 2026-09-13: los bundles JS/CSS se servian
        # sin HSTS aunque el documento HTML si la llevara. Repetida aqui por la misma razon.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Imagenes/fuentes/favicons estaticos: no llevan hash en el nombre (podrian
    # reemplazarse sin cambiar de nombre), asi que se cachean largo pero sin "immutable".
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Proxy inverso para la API versionada del Backend (Requisito Nginx proxy)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HSTS para la API (Spring Security no la emite si no detecta HTTPS explícito)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Soporte para WebSockets (si se utiliza tiempo real)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy para endpoints de monitoreo Actuator
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
